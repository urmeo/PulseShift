name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt -r research/requirements-dev.txt
      - name: Ruff lint
        run: ruff check research/pulseshift research/scripts research/tests
      - name: Ruff format check
        run: ruff format --check research/pulseshift research/scripts research/tests
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "22"
      - name: Browser tests
        run: node --test tests/app.test.cjs
        env:
          PYTHONPATH: research
      - name: mypy
        run: mypy research/pulseshift --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt -r research/requirements-dev.txt
      - name: Verify committed panel checksum
        run: |
          cd research/data/processed
          shasum -a 256 -c panel.sha256
      - name: Run tests with coverage
        run: |
          cd research
          PYTHONPATH=. pytest tests/ -q --cov=pulseshift --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Reproduce analysis and serving model
        if: matrix.python-version == '3.12'
        run: |
          cd research
          PYTHONPATH=. python scripts/run_analysis.py
          PYTHONPATH=. python scripts/train_model.py
          PYTHONPATH=. pytest tests/ -q
          cd ..
          node --test tests/app.test.cjs
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-xml
          path: research/coverage.xml

  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt
          pip install pip-audit==2.10.1
      - name: Audit installed dependencies
        run: pip-audit --strict
