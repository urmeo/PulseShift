<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src https://api.open-meteo.com https://air-quality-api.open-meteo.com; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Estimate DC-area bike-share network demand suppression from weather and air quality. Research model with browser inference." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><circle cx='8' cy='8' r='7' fill='%2338bdf8'/></svg>" />
  <title>PulseShift</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>PulseShift</h1>
      <p class="tag">Weather, air quality and DC-area bike-share network demand.</p>
    </header>

    <section class="panel">
      <form id="form" aria-label="DC demand model inputs">
        <div class="grid">
          <label>Temperature (°F)
            <input type="number" id="temp" value="85" min="-40" max="130" step="any" required />
          </label>
          <label>Humidity (%)
            <input type="number" id="humidity" value="55" min="0" max="100" step="any" required />
          </label>
          <label>Air Quality Index
            <input type="number" id="aqi" value="60" min="0" max="500" step="any" required />
          </label>
          <label>Wind (mph)
            <input type="number" id="wind" value="6" min="0" max="100" step="any" required />
          </label>
          <label>Precipitation (in/hr)
            <input type="number" id="precip" value="0" min="0" max="5" step="any" required />
          </label>
          <label>Visibility (mi)
            <input type="number" id="visibility" value="10" min="0" max="10" step="any" required />
          </label>
          <label>Start hour (DC time)
            <select id="hour"></select>
          </label>
          <label class="check"><input type="checkbox" id="weekend" /> Weekend</label>
          <label class="check"><input type="checkbox" id="smoke" /> Smoke / haze present</label>
          <p class="hint">Enter visibility separately. Smoke/haze is a manual observation, not inferred from AQI.</p>
        </div>
        <button type="button" id="live" class="ghost">Load DC forecast</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>

    <section class="result" id="result" aria-label="Demand suppression estimate" aria-live="polite" aria-atomic="true" hidden>
      <div class="risk" id="risk">
        <span class="pct" id="pct">—</span>
        <span class="band" id="band">—</span>
      </div>
      <p class="reco" id="reco"></p>
      <p class="detail" id="detail"></p>
      <p class="detail" id="besthour"></p>
      <p class="hint" id="forecastnote"></p>
    </section>

    <footer>
      <span id="meta"></span>
      <a href="https://github.com/urmeo/PulseShift">Code &amp; results</a>
      <a href="https://open-meteo.com/">Weather data</a>
    </footer>
    <p class="hint" id="modelnote"></p>
  </main>

  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
