<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src https://api.weather.gov https://air-quality-api.open-meteo.com; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="PulseShift forecasts whether heat, cold, wind, or smoke will suppress an outdoor session, and the safest way to keep it — a calibrated model trained on real Washington DC data, running in your browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><circle cx='8' cy='8' r='7' fill='%2338bdf8'/></svg>" />
  <title>PulseShift</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>PulseShift</h1>
      <p class="tag">Will climate stress suppress your outdoor session? A calibrated forecast and the safest way to keep it.</p>
    </header>

    <section class="panel">
      <form id="form">
        <div class="grid">
          <label>Temperature (°F)
            <input type="number" id="temp" value="85" min="0" max="130" step="1" />
          </label>
          <label>Humidity (%)
            <input type="number" id="humidity" value="55" min="1" max="100" step="1" />
          </label>
          <label>Air Quality Index
            <input type="number" id="aqi" value="60" min="0" max="500" step="1" />
          </label>
          <label>Wind (mph)
            <input type="number" id="wind" value="6" min="0" max="60" step="1" />
          </label>
          <label>Rain (in/hr)
            <input type="number" id="precip" value="0" min="0" max="3" step="0.05" />
          </label>
          <label>Start hour
            <select id="hour"></select>
          </label>
          <label class="check"><input type="checkbox" id="weekend" /> Weekend</label>
          <label class="check" title="Sets visibility to ~3 mi and the smoke flag. Toggling this barely moves the model — the smoke flag and the reduced-visibility term roughly cancel, and air quality adds little beyond weather here."><input type="checkbox" id="smoke" /> Wildfire smoke / haze</label>
          <p class="hint">Smoke / haze assumes reduced visibility (~3 mi). In the DC training data, air quality added almost nothing beyond weather — see the paper for why.</p>
        </div>
        <button type="button" id="live" class="ghost">Use live DC weather</button>
      </form>
    </section>

    <section class="result" id="result" aria-live="polite" hidden>
      <div class="risk" id="risk">
        <span class="pct" id="pct">—</span>
        <span class="band" id="band">—</span>
      </div>
      <p class="reco" id="reco"></p>
      <p class="detail" id="detail"></p>
      <p class="detail" id="besthour"></p>
    </section>

    <footer>
      <span id="meta"></span>
      <a href="https://github.com/urmeo/PulseShift">Code &amp; paper</a>
    </footer>
    <p class="hint" id="modelnote"></p>
  </main>

  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
